name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      # Mantiene la stessa firma tra le build (la cache può scadere dopo giorni di inattività).
      - uses: actions/cache@v4
        with:
          path: signing/debug.keystore
          key: jarvis-debug-keystore-v1
      - run: ./scripts/create-debug-key.sh
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-iPod-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Pubblica APK nelle Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Jarvis-iPod-debug.apk
          gh release create "v1.1.0-build${{ github.run_number }}" Jarvis-iPod-debug.apk \
            --target "$GITHUB_SHA" --latest \
            --title "Jarvis iPod 1.1.0 build ${{ github.run_number }}" \
            --notes "Build automatica di ${GITHUB_SHA::7}: $(git log -1 --pretty=%s). Non provata su dispositivo."
