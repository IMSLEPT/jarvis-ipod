name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./scripts/create-debug-key.sh
      - name: Compila, test e Lint
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug 2>&1 | tee gradle.log
      - name: Riepilogo come annotazioni (il log completo non è sempre scaricabile)
        if: always()
        run: |
          python3 - <<'PY'
          log = open('gradle.log', errors='replace').read().splitlines()
          def enc(s): return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          errors = [l for l in log if l.startswith('e: ') or ' FAILED' in l or 'error:' in l.lower() or l.startswith('* What went wrong') or l.startswith('Execution failed')][:40]
          if errors: print('::warning title=Errori (se la build è fallita)::' + enc('\n'.join(errors)))
          print('::notice title=Coda del log::' + enc('\n'.join(log[-12:])))
          PY
      - name: Impronta SHA-1 della firma
        if: always()
        run: |
          keytool -list -v -keystore signing/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -E 'SHA1' | sed 's/^ *//' | while read -r l; do echo "::notice title=Firma debug::$l"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-iPod-debug
          path: app/build/outputs/apk/debug/app-debug.apk
